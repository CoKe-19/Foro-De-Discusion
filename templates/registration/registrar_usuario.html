{% extends "hilos/base.html" %}
{% load static %}
{% block title %}Registrar usuario | GamerCoke{% endblock %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height:80vh;">
   <div class="form" style="max-width:480px; width:100%;">
      <h2 class="text-center mb-3">🧩 Crear Cuenta</h2>
      <p class="text-center text-muted mb-4">Únete a la comunidad de jugadores más activa</p>
      <form method="post" class="form-body">
         {% csrf_token %}
         {{ form.as_p }}
         <button type="submit" class="btn-primary w-100">Registrarse</button>
      </form>
      <p class="text-center mt-3 mb-0">
         ¿Ya tienes una cuenta?  
         <a href="{% url 'login' %}" class="text-accent">Inicia sesión</a>
      </p>
   </div>
</div>
{% endblock %}
