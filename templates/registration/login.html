{% extends "hilos/base.html" %}
{% load static %}
{% block title %}Iniciar Sesión - Foro GamerCoke{% endblock %}
{% block content %}
<div class="container" style="max-width:420px; margin:2rem auto;">
   <section class="card">
      <img src="{% static 'foro/img/login.jpg' %}" alt="Login">
      <h2>Iniciar sesión</h2>
      {% if form.errors %}
      <p style="color:#c00">Usuario o contraseña inválidos.</p>
      {% endif %}
      <form method="post" action="{% url 'login' %}">
         {% csrf_token %}
         {{ form.as_p }}
         {% if next %}
         <input type="hidden" name="next" value="{{ next }}">
         {% endif %}
         <button class="btn-brand" type="submit">Entrar</button>
      </form>
   </section>
</div>
{% endblock %}
