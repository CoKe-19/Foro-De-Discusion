{% extends "hilos/base.html" %}
{% block title %}{{ titulo|default:"Formulario" }}{% endblock %}
{% block content %}
<div class="form">
   <h2>{{ titulo|default:"Formulario" }}</h2>
   {% if descripcion %}
   <p class="text-muted" style="text-align:center; margin-bottom: 1rem;">{{ descripcion }}</p>
   {% endif %}
   <form method="post" enctype="multipart/form-data" class="form-body">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-primary">
      {{ boton_texto|default:"Guardar" }}
      </button>
   </form>
   {% if volver_url %}
   <div style="text-align:center; margin-top:1.5rem;">
      <a href="{% url volver_url volver_args.0 %}" class="btn-outline-secondary">← Volver</a>
   </div>
   {% endif %}
</div>
{% endblock %}
