{% extends "hilos/base.html" %}
{% block title %}Eliminar Categoría{% endblock %}
{% block content %}
<section class="confirm-container">
   <h2>Confirmar Eliminación</h2>
   <p>¿Seguro que quieres eliminar la categoría "<strong>{{ categoria.nombre }}</strong>"?</p>
   <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn-danger">Sí, eliminar</button>
      <a href="{% url 'lista_categorias' %}" class="btn btn-secondary">Cancelar</a>
   </form>
</section>
{% endblock %}
