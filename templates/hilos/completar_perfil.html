{% extends "hilos/base.html" %}
{% load static %}
{% block title %}Completar Perfil{% endblock %}
{% block content %}
<div class="perfil-container">
   <h2>Completa tu Perfil</h2>
   <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="avatar-section">
         {% if user.perfil.avatar %}
         <img src="{{ user.perfil.avatar.url }}" alt="Avatar" class="avatar-img">
         {% else %}
         <img src="{% static 'foro/img/default-face.png' %}" alt="Avatar por defecto" class="avatar-img">
         {% endif %}
         <br>
         <label for="id_avatar" class="btn-brand">Subir Foto</label>
         <input type="file" name="avatar" id="id_avatar" class="input-file">
      </div>
      <div class="form-group">
         <label for="id_apodo">Apodo:</label>
         {{ form.apodo }}
      </div>
      <div class="form-group">
         <label for="id_bio">Bio:</label>
         {{ form.bio }}
      </div>
      <div class="form-group">
         <label for="id_ubicacion">Ubicación:</label>
         {{ form.ubicacion }}
      </div>
      <div class="form-group">
         <label for="id_email">Email:</label>
         {{ form.email }}
      </div>
      <div class="submit-container">
         <button type="submit" class="btn-brand">Guardar Perfil</button>
      </div>
   </form>
</div>
{% endblock %}
